# docker-compose.prod.yml

services:

  mysql:
    image: mysql:8.0
    container_name: tracking_prod_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - tracking_prod_mysql_data:/var/lib/mysql
    networks:
      - tracking_prod_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: tracking_prod_redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - tracking_prod_redis_data:/data
    networks:
      - tracking_prod_network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: tracking_prod_backend:latest
    container_name: tracking_prod_backend
    restart: always
    env_file:
      - .env.prod
    environment:
      NODE_ENV: production
      DB_HOST: tracking_prod_mysql
      DB_PORT: 3306
      REDIS_HOST: tracking_prod_redis
      REDIS_PORT: 6379
      FLUTTER_APP_DOMAIN: https://tracking.proxymgroup.com
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - tracking_prod_network
      - frontend
    volumes:
      - ./logs:/app/logs
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.tracking-prod.rule=Host(`tracking.proxymgroup.com`)"
      - "traefik.http.routers.tracking-prod.entrypoints=websecure"
      - "traefik.http.routers.tracking-prod.tls.certresolver=letsencrypt-dns"
      - "traefik.http.routers.tracking-prod.middlewares=cloudflare-realip@file,crowdsec@file"
      - "traefik.http.services.tracking-prod.loadbalancer.server.port=5000"

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: tracking_prod_phpmyadmin
    restart: always
    environment:
      PMA_HOST: tracking_prod_mysql
      PMA_USER: ${DB_USER}
      PMA_PASSWORD: ${DB_PASSWORD}
      UPLOAD_LIMIT: 50M
    depends_on:
      - mysql
    networks:
      - tracking_prod_network
      - frontend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.tracking-prod-pma.rule=Host(`pma.proxymgroup.com`)"
      - "traefik.http.routers.tracking-prod-pma.entrypoints=websecure"
      - "traefik.http.routers.tracking-prod-pma.tls.certresolver=letsencrypt-dns"
      - "traefik.http.routers.tracking-prod-pma.middlewares=cloudflare-realip@file,crowdsec@file,tracking-prod-pma-auth@docker"
      - "traefik.http.middlewares.tracking-prod-pma-auth.basicauth.users=${PMA_BASIC_AUTH}"

networks:
  tracking_prod_network:
    driver: bridge
  frontend:
    external: true

volumes:
  tracking_prod_mysql_data:
  tracking_prod_redis_data: