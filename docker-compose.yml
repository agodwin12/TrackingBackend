services:
  redis:
    image: redis:7-alpine
    container_name: proxym_redis
    restart: always
    volumes:
      - redis_data:/data
    networks:
      - proxym_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: proxym_backend
    restart: always
    ports:
      - "6005:6000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DB_HOST: host.docker.internal
      DB_PORT: 3306
      REDIS_HOST: redis
      REDIS_PORT: 6379
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - proxym_network
    volumes:
      - ./logs:/app/logs

networks:
  proxym_network:
    driver: bridge

volumes:
  redis_data: